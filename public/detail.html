<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demand Radar — 机会详情</title>
  <meta name="theme-color" content="#0f1419" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="detail">
  <header>
    <div class="header-top">
      <h1>Demand Radar · 详情</h1>
      <nav>
        <a href="index.html" data-page="decisions">本周决策</a>
        <a href="trends.html" data-page="trends">产品兴衰</a>
        <a href="opportunities.html" data-page="opportunities">原始机会</a>
        <a href="keywords.html" data-page="keywords">关键词</a>
      </nav>
    </div>
    <div id="site-meta-bar" class="site-meta-bar">加载元数据…</div>
  </header>
  <main id="content">
    <p class="meta">加载中…</p>
  </main>
  <footer><a href="opportunities.html">← 返回原始机会</a></footer>
  <script type="module">
    import {
      loadJson,
      setActiveNav,
      renderSiteMetaBar,
      confidenceBadge,
      pendingLabel,
    } from "./assets/app.js";

    setActiveNav();
    await renderSiteMetaBar();

    const idParam = new URLSearchParams(location.search).get("id");
    const oppId = idParam != null ? Number(idParam) : NaN;
    const opportunities = await loadJson("opportunities.json");
    const opp = opportunities.find((o) => o.id === oppId);

    const root = document.getElementById("content");
    if (!opp) {
      root.innerHTML = "<p>未找到该机会（id 无效或数据未更新）。</p>";
    } else {
      const notes = opp.rating_notes || {};
      const noteBlocks = Object.entries(notes)
        .map(
          ([dim, items]) =>
            `<div class="card"><h2>${dim}</h2><ul>${(items || [])
              .map((i) => `<li>${i}</li>`)
              .join("")}</ul></div>`
        )
        .join("");

      const kws = (opp.keywords || [])
        .slice(0, 80)
        .map((k) => `<span class="kw-tag">${k}</span>`)
        .join("");
      const moreKw =
        (opp.keywords || []).length > 80
          ? `<p class="meta">另有 ${opp.keywords.length - 80} 个关键词未展示</p>`
          : "";

      root.innerHTML = `
        <h2 style="margin-top:0">${opp.title || "—"}</h2>
        <p class="meta">${opp.category || ""} · ${opp.status || ""} · 综合分 <strong class="score">${opp.score != null ? opp.score.toFixed(1) : "—"}</strong>（${opp.tier || ""}） ${confidenceBadge(opp.confidence)}</p>
        <p class="meta">待补维度：${pendingLabel(opp.pending_dimensions)}</p>
        <div class="dim-grid">
          <div class="dim-cell"><span>需求</span>${opp.demand_score ?? "—"}</div>
          <div class="dim-cell"><span>变现</span>${opp.monetization_score ?? "—"}</div>
          <div class="dim-cell"><span>竞争</span>${opp.competition_score ?? "—"}</div>
          <div class="dim-cell"><span>可行性</span>${opp.feasibility_score ?? "—"}</div>
          <div class="dim-cell"><span>证据</span>${opp.evidence_score ?? "—"}</div>
        </div>
        <div class="card">
          <h2>聚类关键词</h2>
          <div class="kw-tags">${kws || "—"}</div>
          ${moreKw}
        </div>
        <div class="card">
          <h2>证据摘要</h2>
          <ul>${(opp.evidence_summary || []).map((l) => `<li>${l}</li>`).join("") || "<li>—</li>"}</ul>
        </div>
        ${noteBlocks || ""}
      `;
      document.title = `Demand Radar — ${opp.title || "详情"}`;
    }
  </script>
</body>
</html>
