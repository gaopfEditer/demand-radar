<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demand Radar — 本周决策</title>
  <meta name="theme-color" content="#0f1419" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="decisions">
  <header>
    <div class="header-top">
      <h1>Demand Radar · 本周决策</h1>
      <nav>
        <a href="index.html" data-page="decisions">本周决策</a>
        <a href="opportunities.html" data-page="opportunities">原始机会</a>
        <a href="keywords.html" data-page="keywords">关键词</a>
      </nav>
    </div>
    <div id="site-meta-bar" class="site-meta-bar">加载周决策元数据…</div>
  </header>
  <main>
    <p class="site-intro">
      出海 SEO <strong>周决策卡</strong>：每批固定 <strong>1 Go · 1 Watch · 1 Kill</strong>，聚合主词、变现、SERP 缺口、7 天 MVP、
      <strong>产品增长</strong>与<strong>关键词增长</strong>证据及周边内容。币圈不进评分；脏 Suggest 不得当 Go 主词。
      原始机会评分表见<a href="opportunities.html">原始机会</a>。
    </p>
    <div id="week-overview" class="week-overview" hidden></div>
    <div id="decision-board" class="decision-board">
      <p class="meta">加载决策卡…</p>
    </div>
  </main>
  <footer>Demand Radar · 周决策优先 · 证据优先 · 人工拍板</footer>
  <script type="module">
    import {
      loadJson,
      setActiveNav,
      renderWeekMetaBar,
      sortDecisionCards,
      renderDecisionCard,
      escapeHtml,
    } from "./assets/app.js";

    setActiveNav();
    await renderWeekMetaBar();

    const week = await loadJson("week_decisions.json");
    const overview = document.getElementById("week-overview");
    overview.hidden = false;
    overview.innerHTML = sortDecisionCards(week.cards)
      .map(
        (c) =>
          `<span>${escapeHtml(c.verdict)} · <a href="#${escapeHtml(c.card_id)}">${escapeHtml(c.title)}</a> · <code>${escapeHtml(c.primary_keyword)}</code></span>`
      )
      .join("");

    document.getElementById("decision-board").innerHTML = sortDecisionCards(week.cards)
      .map((c) => renderDecisionCard(c, { detail: false }))
      .join("");
  </script>
</body>
</html>
