<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demand Radar — 本周决策</title>
  <meta name="theme-color" content="#0f1419" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon.ico" sizes="any" />
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body data-page="decisions">
  <header>
    <div class="header-top">
      <h1>Demand Radar · 本周决策</h1>
      <nav>
        <a href="index.html" data-page="decisions">本周决策</a>
        <a href="trends.html" data-page="trends">产品兴衰</a>
        <a href="opportunities.html" data-page="opportunities">原始机会</a>
        <a href="keywords.html" data-page="keywords">关键词</a>
        <a href="waist.html" data-page="waist">腰部词</a>
        <a href="revenue.html" data-page="revenue">收入榜</a>
      </nav>
    </div>
    <div id="site-meta-bar" class="site-meta-bar">加载周决策元数据…</div>
  </header>
  <main>
    <p class="site-intro">
      首页两层：<strong>产品兴衰 · 需求发散</strong>（看谁取代谁、相对需求怎么发散选题）+
      <strong>周决策三卡</strong>（1 Go · 1 Watch · 1 Kill 拍板）。币圈不进评分；脏 Suggest 不得当 Go 主词。
      原始机会评分表见<a href="opportunities.html">原始机会</a>。
    </p>
    <div id="market-narratives-root"></div>
    <div class="section-divider">
      <h2>本周决策三卡</h2>
      <p class="meta">Go / Watch / Kill 各一张 · 证据与完整字段见各卡或<a href="decision.html">单卡页</a> · <a href="waist.html" class="waist-inline-link">腰部词池 →</a></p>
    </div>
    <div id="week-overview" class="week-overview" hidden></div>
    <div id="decision-board" class="decision-board">
      <p class="meta">加载决策卡…</p>
    </div>
  </main>
  <footer>Demand Radar · 周决策优先 · 证据优先 · 人工拍板</footer>
  <script type="module">
    import {
      loadJson,
      setActiveNav,
      renderWeekMetaBar,
      sortDecisionCards,
      renderDecisionCard,
      renderMarketNarratives,
      escapeHtml,
    } from "./assets/app.js";

    setActiveNav();
    await renderWeekMetaBar();

    try {
      const narratives = await loadJson("market_narratives.json");
      document.getElementById("market-narratives-root").innerHTML = renderMarketNarratives(
        narratives,
        { compact: true, maxPerSection: 4 }
      );
    } catch (e) {
      document.getElementById("market-narratives-root").innerHTML =
        `<p class="meta">无法加载 market_narratives.json</p>`;
    }

    const week = await loadJson("week_decisions.json");
    const overview = document.getElementById("week-overview");
    overview.hidden = false;
    overview.innerHTML = sortDecisionCards(week.cards)
      .map(
        (c) =>
          `<span>${escapeHtml(c.verdict)} · <a href="#${escapeHtml(c.card_id)}">${escapeHtml(c.title)}</a> · <code>${escapeHtml(c.primary_keyword)}</code></span>`
      )
      .join("");

    document.getElementById("decision-board").innerHTML = sortDecisionCards(week.cards)
      .map((c) => renderDecisionCard(c, { detail: false }))
      .join("");
  </script>
</body>
</html>
