    const el = document.getElementById("site-meta-bar");
    el.innerHTML = `批次 <strong>${escapeHtml(narratives.week_id)}</strong> · 截止 <strong>${escapeHtml(narratives.as_of)}</strong>（${escapeHtml(narratives.timezone)}） · 关联决策 <strong>${escapeHtml(narratives.linked_week_decisions)}</strong>`;

    document.getElementById("market-narratives-full").innerHTML = renderMarketNarratives(
      narratives,
      { compact: false }
    );
  </script>
